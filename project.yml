name: HanLearn
options:
  bundleIdPrefix: com.hanlearn
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HanLearn:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HanLearn
    info:
      path: HanLearn/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hanlearn.app
      GENERATE_INFOPLIST_FILE: NO

schemes:
  HanLearn:
    build:
      targets:
        HanLearn: all
    run:
      config: Debug
