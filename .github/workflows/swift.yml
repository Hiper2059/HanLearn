name: iOS Swift CI & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Swift Tests
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Run Unit Tests on iOS Simulator
        run: |
          xcodebuild test \
            -project HanLearn.xcodeproj \
            -scheme HanLearn \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            clean test

      - name: Build HanLearn App Target
        run: |
          xcodebuild build \
            -project HanLearn.xcodeproj \
            -scheme HanLearn \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
