# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install XcodeGen
      run: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build and run tests
      run: |
        DESTINATION_ID=$(xcodebuild -project HanLearn.xcodeproj -scheme HanLearn -showdestinations | awk '/platform:iOS Simulator/ { if (match($0, /id:([A-F0-9-]+)/, m)) { print m[1]; exit } }')
        if [ -z "$DESTINATION_ID" ]; then
          echo "No iOS Simulator destination found for scheme HanLearn."
          exit 1
        fi

        xcodebuild test \
          -project HanLearn.xcodeproj \
          -scheme HanLearn \
          -destination "id=$DESTINATION_ID"
