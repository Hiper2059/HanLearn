name: iOS Swift CI & Build IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build HanLearn IPA for iPhone
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive HanLearn for Device (ARM64)
        run: |
          xcodebuild archive \
            -project HanLearn.xcodeproj \
            -scheme HanLearn \
            -destination 'generic/platform=iOS' \
            -archivePath build/HanLearn.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into HanLearn.ipa
        run: |
          mkdir -p Payload
          cp -r build/HanLearn.xcarchive/Products/Applications/HanLearn.app Payload/
          
          TARGET_PLIST="Payload/HanLearn.app/Info.plist"
          echo "Injecting required TCC privacy permissions into $TARGET_PLIST..."
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'HanLearn cần quyền microphone để luyện phát âm tiếng Trung và chấm điểm thanh điệu.'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'HanLearn cần quyền microphone để luyện phát âm tiếng Trung và chấm điểm thanh điệu.'" "$TARGET_PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription 'HanLearn cần quyền nhận diện giọng nói để phân tích phát âm của bạn.'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'HanLearn cần quyền nhận diện giọng nói để phân tích phát âm của bạn.'" "$TARGET_PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$TARGET_PLIST"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName 'LaunchScreen'" "$TARGET_PLIST" || /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string 'LaunchScreen'" "$TARGET_PLIST"
          
          echo "=== VERIFYING FINAL INFO.PLIST IN IPA ==="
          plutil -p "$TARGET_PLIST"
          
          zip -r HanLearn.ipa Payload
          ls -lh HanLearn.ipa

      - name: Upload IPA for Sideloadly / AltStore
        uses: actions/upload-artifact@v4
        with:
          name: HanLearn-IPA
          path: HanLearn.ipa
          retention-days: 7
