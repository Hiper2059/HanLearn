name: iOS Swift CI & Package App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Simulator App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build HanLearn App for iOS Simulator
        run: |
          xcodebuild build \
            -project HanLearn.xcodeproj \
            -scheme HanLearn \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO

      - name: Compress HanLearn.app to ZIP
        run: |
          cd build_output/Build/Products/Debug-iphonesimulator
          zip -r ../../../HanLearn-Simulator.zip HanLearn.app
          cd ../../..
          ls -lh HanLearn-Simulator.zip

      - name: Upload Simulator App (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: HanLearn-Simulator
          path: HanLearn-Simulator.zip
          retention-days: 7
